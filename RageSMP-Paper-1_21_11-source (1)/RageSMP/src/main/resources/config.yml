# RageSMP - réglages
max-rage: 5

# Rage gagnée/perdue
kill-rage: 1
death-rage-loss: 1

# Si le tueur est déjà à max-rage au moment du kill, il ne gagne plus rien :
# à la place, un "éclat de Rage" tombe au sol à l'endroit de la mort.
# N'importe quel joueur peut le ramasser pour gagner overkill-drop-rage-amount de Rage.
overkill-drop-enabled: true
overkill-drop-rage-amount: 1

# Bonus par niveau (pourcentage de dégâts supplémentaires)
damage-bonus:
  0: 0.0
  1: 5.0
  2: 10.0
  3: 15.0
  4: 20.0
  5: 25.0

# Coeurs supplémentaires à partir de Rage 3.
extra-hearts:
  0: 0.0
  1: 0.0
  2: 0.0
  3: 2.0
  4: 4.0
  5: 6.0

# Rage 4: après ce nombre de coups consécutifs contre la même cible,
# le prochain coup ignore une partie de l'armure.
armor-break-hits: 5
armor-break-percent: 25.0

# Rage 5: désactivation du bouclier en secondes.
shield-disable-seconds: 3

# Rage 1: après ce nombre de coups consécutifs à l'épée,
# les coups suivants sont traités comme des critiques jusqu'à rater.
blood-combo-hits: 3
critical-multiplier: 1.5

# Rage 2
speed-amplifier: 0
